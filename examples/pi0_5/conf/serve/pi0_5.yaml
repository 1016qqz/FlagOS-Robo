- serve_id: vllm_model
  engine_args:
    host: 0.0.0.0
    port: 5000
    model_variant: "pi0.5"
    # Local tokenizer dir. The checkpoint's policy_preprocessor.json points at the
    # gated HF repo google/paligemma-3b-pt-224, so serve must be redirected here.
    tokenizer: /workspace/models/google/paligemma-3b-pt-224
    # A released pi0.5 policy directory (weights + policy_preprocessor.json +
    # policy_postprocessor.json). Replace with your own
    # `<output_directory>/checkpoints/<step>/pretrained_model` to serve a locally
    # trained policy.
    model: /workspace/models/lerobot/pi05_libero_base
    device: "cuda"
    # Maps client-sent observation keys to the keys the model was trained with.
    # Format: {key_from_client: key_expected_by_model}
    # rename_map:
    #   "observation/image": "observation.images.image"
    #   "observation/wrist_image": "observation.images.wrist_image"
    #   "observation/state": "observation.state"
    #   "prompt": "task"
