# Adapted from FlagScale .pre-commit-config.yaml @ baseline f8e9a62c.
# FlagScale's `exclude:` block listed megatron-coupled paths
# (flagscale/train/megatron/**, flagscale/models/megatron/** ...). FlagOS-Robo
# has no such paths by design, so the exclude list starts empty.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-merge-conflict
    -   id: check-symlinks
    -   id: detect-private-key
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
    -   id: ruff-check
        args: [--output-format, github, --fix]
    -   id: ruff-format
