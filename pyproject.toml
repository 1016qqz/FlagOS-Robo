[build-system]
requires = ["setuptools>=77.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flagos-robo"
version = "0.1.0.dev0"
description = "FlagOS-Robo: embodied-AI (VLA) model training and inference development kit, backed by BAAI."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# W1 contract: the install-time dependency set must NOT pull in megatron_core.
# Heavy / platform-specific packages live in requirements/ and are installed
# explicitly, keeping `pip install -e .` usable in a pure-torch environment.
dependencies = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5", "pre-commit>=4.2.0", "ruff>=0.14.0"]

[project.urls]
Homepage = "https://github.com/flagos-ai/FlagOS-Robo"

[tool.setuptools.packages.find]
include = ["flagos_robo*"]

[tool.setuptools.package-data]
"flagos_robo" = ["**/*.yaml", "**/*.yml"]

# ---------------------------------------------------------------------------
# Lint / format baseline inherited verbatim from FlagScale (baseline f8e9a62c)
# so migrated files do not churn on reformat.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "I",
    "B002", "B003", "B004", "B005", "B009", "B010", "B011", "B012",
    "B013", "B014", "B015", "B016", "B017", "B018", "B019", "B020",
    "B021", "B022", "B025", "B029", "B032",
    "SIM101", "SIM103", "SIM117",
    "G",
    "TC",
    "RUF005", "RUF008", "RUF009", "RUF010", "RUF013", "RUF015", "RUF016",
    "RUF017", "RUF018", "RUF019", "RUF020", "RUF024", "RUF026", "RUF100",
    "Q003", "Q004",
]
ignore = [
    "E402",
    "E501",
    "E722",
    "E731",
    "E741",
    "F403", "F405",
    "B905",
    "B007",
    "UP032",
    "G004",
    "UP015",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-local-folder = ["flagos_robo"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
